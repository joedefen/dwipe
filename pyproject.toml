[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "dwipe"
version = "3.1.0"
description = "A tool to wipe disks and partitions for Linux"
authors = [
    { name = "Joe Defen", email = "joedef@google.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["disk", "partition", "wipe", "clean", "scrub"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    'console-window == 2.1.3',
]

[project.optional-dependencies]
test = [
    'pytest >= 7.0',
    'pytest-cov >= 4.0',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/dwipe"
"Bug Tracker" = "https://github.com/joedefen/dwipe/issues"

[project.scripts]
dwipe = "dwipe.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["dwipe"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true